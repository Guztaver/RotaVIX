<header class="header">
  <div class="header__inner container">
    <!-- Left: Back button (conditional) + Logo -->
    <div class="header__left">
      @if (showBack()) {
        <button class="header__icon-btn" (click)="goBack()" aria-label="Voltar">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
      }
      <a routerLink="/" class="header__logo">
        <svg
          width="34"
          height="34"
          viewBox="0 0 32 32"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="header__logo-icon"
        >
          <rect width="32" height="32" rx="8" fill="var(--color-primary)" />
          <path
            d="M8 16h16M16 8l8 8-8 8"
            stroke="#76BE3F"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="22" cy="16" r="3" fill="#76BE3F" />
        </svg>
        <span class="header__logo-text">RotaVIX</span>
      </a>
    </div>

    <!-- Center: Quick nav (desktop) -->
    <nav class="header__nav">
      <a
        routerLink="/"
        class="header__nav-link"
        routerLinkActive="header__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        Buscar
      </a>
      <a
        routerLink="/reservas"
        class="header__nav-link"
        routerLinkActive="header__nav-link--active"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        Reservas
      </a>
    </nav>

    <!-- Right: Login / user -->
    <div class="header__right">
      @if (!auth.username()) {
        <button class="header__login-btn" (click)="auth.openLogin()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="header__login-label">Entrar</span>
        </button>
      }
      @if (auth.username(); as name) {
        <div class="header__user-pill">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="header__user-name">{{ name }}</span>
          <button class="header__logout-btn" (click)="auth.logout()" title="Sair">✕</button>
        </div>
      }
    </div>
  </div>
</header>
