<header class="header">
  <div class="header__inner container">
    <!-- Left: Back button (conditional) + Logo -->
    <div class="header__left">
      @if (showBack()) {
        <button class="header__icon-btn" (click)="goBack()" aria-label="Voltar">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
      }
      <a routerLink="/" class="header__logo">
        <svg
          width="34"
          height="34"
          viewBox="0 0 32 32"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="header__logo-icon"
        >
          <rect width="32" height="32" rx="8" fill="var(--color-primary)" />
          <path
            d="M8 16h16M16 8l8 8-8 8"
            stroke="#76BE3F"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="22" cy="16" r="3" fill="#76BE3F" />
        </svg>
        <span class="header__logo-text">RotaVIX</span>
      </a>
    </div>

    <!-- Center: Quick nav (desktop) -->
    <nav class="header__nav">
      <a
        routerLink="/"
        class="header__nav-link"
        routerLinkActive="header__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        Buscar
      </a>
      <a
        routerLink="/reservas"
        class="header__nav-link"
        routerLinkActive="header__nav-link--active"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        Reservas
      </a>
    </nav>

    <!-- Right: Actions -->
    <div class="header__right">
      <a
        routerLink="/reservas"
        class="header__nav-link"
        routerLinkActive="header__nav-link--active"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        Minhas reservas
      </a>
      <app-login />
      <button class="header__icon-btn" (click)="refresh()" aria-label="Atualizar" title="Atualizar">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
