<!-- Only the dialog overlay — trigger is in the header -->
@if (auth.loginOpen()) {
  <div class="login__overlay" (click)="auth.closeLogin()">
    <div class="login__dialog card animate-scale-in" (click)="$event.stopPropagation()">
      <button class="login__close" (click)="auth.closeLogin()" aria-label="Fechar">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>

      <h2 class="login__title">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="var(--color-primary)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Identifique-se
      </h2>
      <p class="login__desc">
        Digite um nome de usuário para vincular suas reservas. Nenhum cadastro ou senha é
        necessário.
      </p>

      <div class="form-group">
        <label class="form-label" for="login-username">Nome de usuário</label>
        <input
          id="login-username"
          type="text"
          class="form-input"
          [ngModel]="auth.loginInput()"
          (ngModelChange)="auth.loginInput.set($event)"
          placeholder="Ex: joao.silva"
          (keydown.enter)="auth.submitLogin()"
          autofocus
        />
        @if (auth.loginInput().length > 0 && auth.loginInput().length < 2) {
          <span class="form-error">Mínimo 2 caracteres.</span>
        }
      </div>

      <div class="login__actions">
        <button class="btn btn-ghost" (click)="auth.closeLogin()">Cancelar</button>
        <button
          class="btn btn-accent"
          (click)="auth.submitLogin()"
          [disabled]="auth.loginInput().trim().length < 2"
        >
          Salvar
        </button>
      </div>
    </div>
  </div>
}
