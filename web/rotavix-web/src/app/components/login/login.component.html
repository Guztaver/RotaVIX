<!-- Trigger: shown in header when logged out -->
<div class="login">
  <!-- Logged out → show login button -->
  @if (!auth.username()) {
    <button class="login__trigger" (click)="open()">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      Entrar
    </button>
  }
  <!-- Logged in → show username -->
  @if (auth.username(); as name) {
    <div class="login__user">
      <span class="login__user-icon">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </span>
      <span class="login__user-name">{{ name }}</span>
      <button class="login__logout-btn" (click)="logout()" title="Sair">✕</button>
    </div>
  }

  <!-- Dialog overlay -->
  @if (showDialog()) {
    <div class="login__overlay" (click)="close()">
      <div class="login__dialog card animate-scale-in" (click)="$event.stopPropagation()">
        <h2 class="login__title">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--color-primary)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Identifique-se
        </h2>
        <p class="login__desc">
          Digite um nome de usuário para vincular suas reservas. Nenhum cadastro ou senha é
          necessário.
        </p>

        <div class="form-group">
          <label class="form-label" for="login-username">Nome de usuário</label>
          <input
            id="login-username"
            type="text"
            class="form-input"
            [ngModel]="inputName()"
            (ngModelChange)="inputName.set($event)"
            placeholder="Ex: joao.silva"
            (keydown.enter)="submit()"
            autofocus
          />
          @if (inputName().length > 0 && inputName().length < 2) {
            <span class="form-error">Mínimo 2 caracteres.</span>
          }
        </div>

        <div class="login__actions">
          <button class="btn btn-ghost" (click)="close()">Cancelar</button>
          <button
            class="btn btn-accent"
            (click)="submit()"
            [disabled]="inputName().trim().length < 2"
          >
            Salvar
          </button>
        </div>
      </div>
    </div>
  }
</div>
