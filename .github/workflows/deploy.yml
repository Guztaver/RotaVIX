name: Build & Deploy RotaVIX

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository_owner }}/rotavix-api
  WEB_IMAGE: ${{ github.repository_owner }}/rotavix-web

jobs:
  # ─── Build & Push Docker Images ───────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            context: ./api/rotavix-api
            image-suffix: rotavix-api
            port: 3000
          - name: web
            context: ./web/rotavix-web
            image-suffix: rotavix-web
            port: 80
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image-suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Lint & Type-check Backend ────────────────────────────────
  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api/rotavix-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./api/rotavix-api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx nest build

  # ─── Lint & Build Frontend ────────────────────────────────────
  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web/rotavix-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ./web/rotavix-web/package-lock.json
      - run: npm ci
      - run: NG_CLI_ANALYTICS=false npx ng build --configuration production
