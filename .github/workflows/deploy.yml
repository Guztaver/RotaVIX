name: Build & Deploy RotaVIX

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Build & Type-check Backend ────────────────────────────────
  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/rotavix-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: api/rotavix-api/package-lock.json
      - run: npm ci
      - run: npm run build

  # ─── Build & Type-check Frontend ───────────────────────────────
  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/rotavix-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/rotavix-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild
      - run: NG_CLI_ANALYTICS=false pnpm exec ng build --configuration production

  # ─── Build & Push Docker Images ────────────────────────────────
  build-and-push:
    needs: [lint-api, lint-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api
            context: ./api/rotavix-api
            image: rotavix-api
          - name: web
            context: ./web/rotavix-web
            image: rotavix-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
