# Netlify — Deploy do Frontend Angular
# RotaVIX frontend config
[build]
  base = "web/rotavix-web"
  command = "npm ci && NG_CLI_ANALYTICS=false npx ng build --configuration production"
  publish = "dist/rotavix-web/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
