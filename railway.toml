# Railway — Deploy do RotaVIX (2 serviços)
# Docs: https://docs.railway.com

# Cada serviço aponta para seu subdiretório.
# No dashboard do Railway, crie 2 serviços a partir deste repo:
#   1. rotavix-api  → Root Directory: api/rotavix-api
#   2. rotavix-web  → Root Directory: web/rotavix-web

[build]
  builder = "NIXPACKS"

[service.api]
  name = "rotavix-api"
  root = "api/rotavix-api"

  [service.api.build]
    builder = "NIXPACKS"

  [service.api.deploy]
    healthcheckPath = "/"
    restartPolicyType = "ALWAYS"

[service.web]
  name = "rotavix-web"
  root = "web/rotavix-web"

  [service.web.build]
    builder = "NIXPACKS"

  [service.web.deploy]
    healthcheckPath = "/"
    restartPolicyType = "ALWAYS"
