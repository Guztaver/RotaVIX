# Railway — Deploy do RotaVIX
# Usa Dockerfiles existentes (já testados e funcionando)
# Docs: https://docs.railway.com

# Serviço 1: Backend API
[service.api]
  name = "rotavix-api"
  root = "api/rotavix-api"

  [service.api.build]
    dockerfilePath = "Dockerfile"

  [service.api.deploy]
    healthcheckPath = "/"
    restartPolicyType = "ALWAYS"

# Serviço 2: Frontend Web
[service.web]
  name = "rotavix-web"
  root = "web/rotavix-web"

  [service.web.build]
    dockerfilePath = "Dockerfile"

  [service.web.deploy]
    healthcheckPath = "/"
    restartPolicyType = "ALWAYS"
